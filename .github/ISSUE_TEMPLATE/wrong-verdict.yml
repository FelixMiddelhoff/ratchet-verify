name: Wrong or surprising verdict
description: ratchet said safe when the bump broke something, broken when it didn't, or flagged something irrelevant.
labels: ["bug"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong?
      options:
        - False "safe" (the bump actually broke something)
        - False "broken"
        - A "risky" hit that does not affect my code
        - Wrong or confusing message
        - Crash or error
        - Very slow
    validations:
      required: true
  - type: input
    id: bump
    attributes:
      label: The bump
      description: Package and versions, e.g. `chalk 4.1.2 -> 5.3.0`
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: ratchet output
      description: The full output (text, or `--json`). Remove anything private.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what actually happened to your project?
      description: If a real break was missed, what broke and which changelog lines described it?
  - type: input
    id: version
    attributes:
      label: ratchet-verify version and Node version
      description: Output of `ratchet-verify --version` and `node -v`.
