version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # ratchet parses code with the JavaScript compiler API. TypeScript 7 (the native port)
      # does not ship it, and ratchet's own check proves it: see the pull request that tried.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
